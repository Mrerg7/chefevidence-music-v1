# Cloudflare Workers Static Assets with canonical URL redirects
name = "chefevidence-music-v1"
compatibility_date = "2026-08-11"
main = "src/worker.ts"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = true
html_handling = "force-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "chefevidence.music"
custom_domain = true

[[routes]]
pattern = "www.chefevidence.music"
custom_domain = true
